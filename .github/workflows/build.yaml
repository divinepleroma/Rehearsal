name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:

# The build only reads the repository; it never needs to write to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Build
        run: dotnet build Rehearsal/Rehearsal.csproj --configuration Release

      - name: Test
        run: dotnet test Rehearsal.Tests/Rehearsal.Tests.csproj --configuration Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Rehearsal
          path: Rehearsal/bin/Release/Rehearsal/latest.zip
          if-no-files-found: error
