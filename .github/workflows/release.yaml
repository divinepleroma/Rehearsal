name: Release

# Pushing a tag like v0.2.0 builds that commit and publishes latest.zip as a GitHub release.
# docs/repo.json (the list Dalamud reads) points at exactly that file, so the version in the
# project, the tag and repo.json have to agree; the tests and the check below make sure they do.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # Only this job may write, and only to create the release.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.x.x'

      - name: Check the tag against the project version
        shell: pwsh
        run: |
          [xml] $project = Get-Content Rehearsal/Rehearsal.csproj
          $version = [version] ("$($project.Project.PropertyGroup.Version)".Trim())
          $expected = "v$($version.ToString(3))"
          if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Tag $env:GITHUB_REF_NAME does not match the project version ($expected)."
          }

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Build
        run: dotnet build Rehearsal/Rehearsal.csproj --configuration Release

      - name: Test
        run: dotnet test Rehearsal.Tests/Rehearsal.Tests.csproj --configuration Release

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Rehearsal $($env:GITHUB_REF_NAME.TrimStart('v'))"
          gh release create $env:GITHUB_REF_NAME Rehearsal/bin/Release/Rehearsal/latest.zip --title $title --generate-notes --verify-tag
